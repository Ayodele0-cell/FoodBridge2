<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodBridge — Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green: #2E7D32;
    --green-light: #81C784;
    --orange: #F57C00;
    --cream: #FFF8E7;
    --brown: #5D4037;
    --white: #ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background: linear-gradient(180deg, #FBF7EE 0%, #F2ECDD 100%);
    color: var(--brown);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }
  h1,h2,h3,.headline{ font-family:'Nunito', sans-serif; font-weight:800; }

  /* ---------- Top chrome ---------- */
  .app-header{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .app-header .logo-mark{
    width:34px; height:34px; border-radius:10px; background:var(--green);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .app-header .logo-text{ font-family:'Nunito', sans-serif; font-weight:900; font-size:26px; color:var(--green); letter-spacing:-0.5px; }
  .app-header .logo-text span{ color:var(--orange); }
  .tagline{ font-size:12.5px; color:#8a7a6d; margin-bottom:22px; text-align:center; }

  .mode-toggle{
    display:flex; background:#EFE6D2; border-radius:999px; padding:4px; margin-bottom:26px;
    box-shadow: inset 0 1px 3px rgba(93,64,55,0.12);
  }
  .mode-toggle button{
    border:none; background:transparent; padding:9px 22px; border-radius:999px;
    font-family:'Inter'; font-weight:700; font-size:13.5px; color:#8a7a6d; cursor:pointer;
    transition: all .25s ease;
  }
  .mode-toggle button.active{
    background: var(--green); color:#fff; box-shadow: 0 3px 10px rgba(46,125,50,0.35);
  }
  .mode-toggle button.active.vendor{ background: var(--orange); box-shadow: 0 3px 10px rgba(245,124,0,0.35); }

  /* ---------- Phone frame ---------- */
  .phone{
    width:430px;
    height:932px;
    max-width:96vw;
    max-height:135vh;
    background:#111;
    border-radius:60px;
    padding:12px;
    border:5px solid #2e2e2e;
    box-shadow:
        0 40px 80px rgba(0,0,0,.35),
        inset 0 0 2px rgba(255,255,255,.2);
    position:relative;
  }
  .notch{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:126px;
    height:36px;
    background:#000;
    border-radius:30px;
    z-index:20;
  }
  .screen{
    width:100%; height:100%; background:var(--cream); border-radius:32px; overflow:hidden;
    position:relative; display:flex; flex-direction:column;
  }
  .status-bar{
    height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:15px; font-weight:700; color:var(--brown);
  }
  .screen-body{
    flex:1; overflow-y:auto; padding: 4px 18px 18px;
    animation: slideIn .32s cubic-bezier(.2,.8,.2,1);
  }
  .screen-body::-webkit-scrollbar{ display:none; }
  @keyframes slideIn{ from{ opacity:0; transform: translateX(14px);} to{opacity:1; transform:translateX(0);} }

  /* ---------- shared bits ---------- */
  .top-title{ font-size:22px; margin:6px 0 14px; color:var(--brown); }
  .subtle{ color:#9c8b7d; font-size:12.5px; }
  .search-bar{
    background:#fff; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:8px;
    box-shadow: 0 2px 8px rgba(93,64,55,0.08); margin-bottom:14px; font-size:13.5px; color:#9c8b7d;
  }
  .filter-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;}
  .filter-chip{
    flex:none; padding:7px 14px; border-radius:999px; background:#fff; font-size:12.5px; font-weight:600;
    color:var(--brown); border:1.5px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{ background:var(--green); color:#fff; }

  .card{
    background:#fff; border-radius:18px; padding:12px; display:flex; gap:12px; margin-bottom:12px;
    box-shadow: 0 3px 12px rgba(93,64,55,0.08); cursor:pointer; transition: transform .15s ease;
    border:1.5px solid transparent;
  }
  .card:active{ transform: scale(0.98); }
  .card:hover{ border-color: var(--green-light); }
  .thumb{
    width:72px;
    height:72px;
    overflow:hidden;
    border-radius:15px;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}
  .card-info{ flex:1; min-width:0; }
  .card-info .vname{ font-size:11.5px; color:#9c8b7d; font-weight:600; }
  .card-info .fname{ font-size:14.5px; font-weight:700; color:var(--brown); margin:1px 0 5px; }
  .price-row{ display:flex; align-items:center; gap:6px; }
  .price-old{ font-size:11.5px; color:#b5a696; text-decoration:line-through; }
  .price-new{ font-size:14px; font-weight:800; color:var(--green); }
  .meta-row{ display:flex; align-items:center; gap:8px; margin-top:5px; }
  .discount-tag{
    font-size:10.5px; font-weight:800; color:#fff; background:var(--orange); padding:2px 8px; border-radius:999px;
  }
  .time-ring{
    width:9px; height:9px; border-radius:50%; flex:none;
  }
  .dist{ font-size:11px; color:#9c8b7d; }

  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:16px; background:var(--green); color:#fff;
    font-family:'Inter'; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
    box-shadow: 0 6px 16px rgba(46,125,50,0.3); transition: transform .12s ease;
  }
  .btn-primary:active{ transform: scale(0.97); }
  .btn-primary.orange{ background:var(--orange); box-shadow:0 6px 16px rgba(245,124,0,0.3); }
  .btn-secondary{
    width:100%; padding:13px; border-radius:16px; background:#fff; color:var(--brown);
    font-weight:700; font-size:14px; border:1.5px solid #e6dcc8; cursor:pointer; margin-top:10px;
  }
  .back-btn{
    display:flex; align-items:center; gap:6px; color:var(--brown); font-weight:700; font-size:13.5px;
    margin: 8px 0 10px; cursor:pointer; width:fit-content;
  }

  /* Details screen */
  .hero-photo{
    width:100%;
    height:220px;
    overflow:hidden;
    border-radius:20px;
}

.hero-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
  .detail-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #eee2cd; font-size:13.5px; }
  .detail-row .label{ color:#9c8b7d; }
  .detail-row .val{ font-weight:700; }
  .badge-row{ display:flex; gap:8px; margin:12px 0; }
  .badge{ font-size:11px; font-weight:700; padding:5px 10px; border-radius:10px; background:#EAF5EA; color:var(--green); }
  .badge.rating{ background:#FFF1DE; color:var(--orange); }
  .chat-btn{
    width:100%; padding:13px; border-radius:16px; background:#fff; border:1.5px solid var(--green);
    color:var(--green); font-weight:700; font-size:13.5px; margin-top:8px; cursor:pointer;
  }

  /* Checkout */
  .summary-box{ background:#fff; border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 3px 12px rgba(93,64,55,0.06); }
  .pay-option{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; border:1.5px solid #eee2cd;
    margin-bottom:10px; cursor:pointer; font-size:13.5px; font-weight:600;
  }
  .pay-option.selected{ border-color:var(--green); background:#F3F9F1; }
  .radio-dot{ width:16px; height:16px; border-radius:50%; border:2px solid #d8cbb5; flex:none; position:relative; }
  .pay-option.selected .radio-dot{ border-color:var(--green); }
  .pay-option.selected .radio-dot::after{
    content:''; position:absolute; inset:2px; border-radius:50%; background:var(--green);
  }
  .total-row{ display:flex; justify-content:space-between; font-size:16px; font-weight:800; margin-top:8px; }

  /* Confirmation */
  .confirm-wrap{ text-align:center; padding-top:18px; }
  .check-circle{
    width:64px; height:64px; border-radius:50%; background:var(--green); color:#fff; font-size:30px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .qr-box{
    width:150px; height:150px; margin:16px auto; background:#fff; border-radius:16px; display:flex;
    align-items:center; justify-content:center; font-size:64px; box-shadow:0 3px 12px rgba(93,64,55,0.1);
  }
  .order-id{ font-size:12.5px; color:#9c8b7d; margin-bottom:4px; }

  /* Vendor screens */
  .field-label{ font-size:12px; font-weight:700; color:#9c8b7d; margin:14px 0 6px; text-transform:uppercase; letter-spacing:0.4px; }
  .upload-box{
    width:100%; height:110px; border-radius:16px; border:2px dashed #d8cbb5; background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    font-size:12.5px; color:#9c8b7d; font-weight:600;
  }
  .upload-box.filled{ border-style:solid; border-color:var(--green-light); font-size:44px; color:transparent; }
  .input-field{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid #eee2cd; background:#fff;
    font-size:14px; font-family:'Inter'; color:var(--brown); outline:none;
  }
  .input-field:focus{ border-color: var(--green-light); }
  select.input-field{ appearance:none; -webkit-appearance:none; }
  .discount-preview{
    margin-top:16px; padding:14px; border-radius:16px; background:var(--brown); color:var(--cream);
  }
  .discount-preview .tier-label{ font-size:11.5px; font-weight:700; color:var(--green-light); text-transform:uppercase; letter-spacing:0.5px; }
  .discount-preview .tier-pct{ font-family:'Nunito'; font-weight:900; font-size:26px; margin:2px 0; }
  .discount-preview .tier-note{ font-size:11.5px; opacity:0.8; }
  .stat-grid{ display:flex; gap:10px; margin:14px 0; }
  .stat-box{ flex:1; background:#fff; border-radius:14px; padding:12px; text-align:center; box-shadow:0 3px 10px rgba(93,64,55,0.06); }
  .stat-box .num{ font-family:'Nunito'; font-weight:900; font-size:19px; color:var(--green); }
  .stat-box .lab{ font-size:10.5px; color:#9c8b7d; font-weight:600; margin-top:2px; }
  .action-row{ display:flex; gap:10px; margin-top:16px; }
  .action-row button{ flex:1; }

  .caption{
    margin-top:18px; text-align:center; font-size:12px; color:#9c8b7d; max-width:375px; line-height:1.5;
  }
  .caption b{ color:var(--brown); }
</style>
</head>
<body>

  <div class="app-header">
    <div class="logo-mark">🌿</div>
    <div class="logo-text">Food<span>Bridge</span></div>
  </div>
  <div class="tagline">Surplus food, rescued at a fair price — click through the flow below</div>

  <div class="mode-toggle">
    <button id="btnBuyer" class="active">Buyer view</button>
    <button id="btnVendor">Vendor view</button>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● 90%</span>
      </div>
      <div class="screen-body" id="screenBody"></div>
    </div>
  </div>

  <div class="caption" id="caption"></div>

<script>
const state = { mode:'buyer', buyerScreen:'home', vendorScreen:'dashboard', selectedItem:null, payMethod:'now', vendorItem:null };

const foodItems = [
  { vendor:"BOKKU", name:"Bokku Bread Loaves", cat:"Bakery", image:"images/Bokkubread.jpeg", bg:"#FBEFD9", original:1500, hours:0.6, qty:6, dist:"0.4km",
    desc:"Freshly baked yesterday — soft sandwich loaves and dinner rolls, still good for 2 more days.", pickup:"12 Herbert Macaulay Way, Yaba", rating:4.8 },
  { vendor:"ITEM 7", name:"Jollof Rice & Turkey", cat:"Restaurant", image:"images/Jollof Rice & Turkey.jpeg", bg:"#F3E7D4", original:2000, hours:2.2, qty:4, dist:"0.9km",
    desc:"Today's lunch batch, kept warm — party jollof with grilled chicken and coleslaw.", pickup:"Akoka Round-About, near UNILAG gate", rating:4.6 },
  { vendor:"KOREDE SPAG", name:"Spaghetti & Turkey Combo", cat:"Fast Food", image:"images/Korede Spag.jpeg", bg:"#FDEBD0", original:2800, hours:4.5, qty:9, dist:"1.2km",
    desc:"End-of-day combo packs, made fresh this afternoon, still 4+ hours to closing.", pickup:"Bode Thomas St, Surulere", rating:4.7 },
  { vendor:"IYA MORIA", name:"Amala, Ewedu & Beef", cat:"Supermarket", image:"images/Amala & Ewedu.jpeg", bg:"#E9F3E4", original:3200, hours:0.3, qty:3, dist:"0.6km",
    desc:"Mixed box of ripe fruit and vegetables pulled from today's shelf, closing very soon.", pickup:"Sabo Market Road, Yaba", rating:4.5 },
];

function getTier(hours){
  if(hours > 3) return { pct:0, label:"Fresh price · 3+ hrs to close", ring:"var(--green)" };
  if(hours > 1) return { pct:18, label:"Early discount · 1–3 hrs to close", ring:"var(--green-light)" };
  return { pct:38, label:"Final hour · limited stock", ring:"var(--orange)" };
}
function priced(item){
  const t = getTier(item.hours);
  const discounted = Math.round(item.original * (1 - t.pct/100));
  return { ...t, discounted };
}
function naira(n){ return "₦" + n.toLocaleString(); }

function setMode(mode){
  state.mode = mode;
  document.getElementById('btnBuyer').classList.toggle('active', mode==='buyer');
  document.getElementById('btnVendor').classList.toggle('active', mode==='vendor');
  document.getElementById('btnVendor').classList.toggle('vendor', mode==='vendor');
  render();
}
document.getElementById('btnBuyer').onclick = ()=> setMode('buyer');
document.getElementById('btnVendor').onclick = ()=> setMode('vendor');

function render(){
  const body = document.getElementById('screenBody');
  const cap = document.getElementById('caption');
  if(state.mode === 'buyer'){
    if(state.buyerScreen==='home'){ body.innerHTML = renderHome(); cap.innerHTML = "<b>Screen 1 — Home.</b> Tap any food card to open its details."; }
    if(state.buyerScreen==='details'){ body.innerHTML = renderDetails(); cap.innerHTML = "<b>Screen 2 — Food Details.</b> Tap Reserve Now to continue to checkout."; }
    if(state.buyerScreen==='checkout'){ body.innerHTML = renderCheckout(); cap.innerHTML = "<b>Screen 3 — Checkout.</b> Choose a payment option and confirm."; }
    if(state.buyerScreen==='confirm'){ body.innerHTML = renderConfirm(); cap.innerHTML = "<b>Screen 4 — Order Confirmation.</b> Buyer shows this QR code at pickup."; }
  } else {
    if(state.vendorScreen==='dashboard'){ body.innerHTML = renderDashboard(); cap.innerHTML = "<b>Vendor Dashboard.</b> Upload takes under a minute — discount is calculated automatically."; }
    if(state.vendorScreen==='listing'){ body.innerHTML = renderListingPreview(); cap.innerHTML = "<b>Vendor Listing Preview.</b> Vendor tracks reservations live until pickup or sold out."; }
  }
  attachHandlers();
}

function renderHome(){
  const cards = foodItems.map((item, i)=>{
    const p = priced(item);
    return `
    <div class="card" data-idx="${i}">
      <div class="thumb">
<img src="${item.image}">
</div>
      <div class="card-info">
        <div class="vname">${item.vendor}</div>
        <div class="fname">${item.name}</div>
        <div class="price-row">
          <span class="price-old">${naira(item.original)}</span>
          <span class="price-new">${naira(p.discounted)}</span>
        </div>
        <div class="meta-row">
          <span class="time-ring" style="background:${p.ring}"></span>
          <span class="discount-tag">${p.pct}% OFF</span>
          <span class="dist">${item.dist} · ${item.qty} left</span>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
    <h2 class="top-title">Food Near You</h2>
    <div class="search-bar">🔍 Search vendors or dishes...</div>
    <div class="filter-row">
      <div class="filter-chip active">All</div>
      <div class="filter-chip">Bakery</div>
      <div class="filter-chip">Restaurant</div>
      <div class="filter-chip">Fast Food</div>
      <div class="filter-chip">Supermarket</div>
    </div>
    ${cards}
  `;
}

function renderDetails(){
  const item = state.selectedItem ?? foodItems[0];
  const p = priced(item);
  return `
    <div class="back-btn" id="backHome">← Back</div>
    <div class="hero-photo">
<img src="${item.image}">
</div>
    <h2 class="top-title" style="margin-top:0">${item.name}</h2>
    <div class="subtle" style="margin-bottom:10px">${item.vendor} · ${item.dist} away</div>
    <div class="badge-row">
      <span class="badge">✓ Food safety checked</span>
      <span class="badge rating">★ ${item.rating}</span>
    </div>
    <div class="subtle" style="line-height:1.5; margin-bottom:4px">${item.desc}</div>
    <div class="detail-row"><span class="label">Quantity remaining</span><span class="val">${item.qty} portions</span></div>
    <div class="detail-row"><span class="label">Original price</span><span class="val">${naira(item.original)}</span></div>
    <div class="detail-row"><span class="label">Discounted price</span><span class="val" style="color:var(--green)">${naira(p.discounted)} (${p.pct}% off)</span></div>
    <div class="detail-row"><span class="label">Time left</span><span class="val">${p.label}</span></div>
    <div class="detail-row"><span class="label">Pickup location</span><span class="val" style="color:var(--green); text-decoration:underline">${item.pickup} ↗</span></div>
    <button class="btn-primary orange" id="reserveBtn">Reserve Now</button>
    <button class="chat-btn">💬 Chat Vendor</button>
  `;
}

function renderCheckout(){
  const item = state.selectedItem ?? foodItems[0];
  const p = priced(item);
  return `
    <div class="back-btn" id="backDetails">← Back</div>
    <h2 class="top-title">Checkout</h2>
    <div class="summary-box">
      <div class="detail-row" style="border:none; padding-top:0"><span class="label">${item.name}</span><span class="val">${naira(p.discounted)}</span></div>
      <div class="detail-row" style="border:none"><span class="label">Pickup time</span><span class="val">${p.pct===38 ? 'Within the hour' : p.pct===18 ? 'Next 1–3 hrs' : 'Before 3 hrs'}</span></div>
      <div class="detail-row" style="border:none; padding-bottom:0"><span class="label">Vendor</span><span class="val">${item.vendor}</span></div>
    </div>
    <div class="field-label">Payment Method</div>
    <div class="pay-option ${state.payMethod==='now'?'selected':''}" data-pay="now">
      <div class="radio-dot"></div> Pay Now (card / transfer)
    </div>
    <div class="pay-option ${state.payMethod==='pickup'?'selected':''}" data-pay="pickup">
      <div class="radio-dot"></div> Reserve & Pay at Pickup
    </div>
    <div class="summary-box" style="margin-top:14px">
      <div class="total-row"><span>Total</span><span style="color:var(--green)">${naira(p.discounted)}</span></div>
    </div>
    <button class="btn-primary" id="payBtn">${state.payMethod==='now' ? 'Pay Now' : 'Reserve & Pay at Pickup'}</button>
  `;
}

function renderConfirm(){
  const item = state.selectedItem ?? foodItems[0];
  return `
    <div class="confirm-wrap">
      <div class="check-circle">✓</div>
      <h2 class="top-title" style="margin-top:0">Order Successful</h2>
      <div class="subtle">${item.name} · ${item.vendor}</div>
      <div class="qr-box">▦</div>
      <div class="order-id">Order ID: FB-84213</div>
      <div class="detail-row" style="text-align:left"><span class="label">Pickup address</span><span class="val">${item.pickup}</span></div>
      <div class="detail-row" style="text-align:left"><span class="label">Pickup deadline</span><span class="val">${getTier(item.hours).label.split('·')[0].trim()}</span></div>
      <button class="btn-primary" style="margin-top:18px">Directions ↗</button>
      <button class="btn-secondary" id="backToHomeFromConfirm">Back to Home</button>
    </div>
  `;
}

// ---------- Vendor screens ----------
function renderDashboard(){
  return `
    <h2 class="top-title">Upload Surplus Food</h2>
    <div class="subtle" style="margin-bottom:6px">List an item in under a minute — the discount tier is set for you.</div>
    <div class="field-label">Photo</div>
    <div class="upload-box" id="uploadBox">📷 Tap to add a photo</div>
    <div class="field-label">Food Name</div>
    <input class="input-field" id="foodName" placeholder="e.g. Assorted Bread Loaves" value="Assorted Bread Loaves">
    <div class="field-label">Quantity</div>
    <input class="input-field" id="foodQty" type="number" value="8">
    <div class="field-label">Original Price (₦)</div>
    <input class="input-field" id="foodPrice" type="number" value="1500">
    <div class="field-label">Closing Time</div>
    <select class="input-field" id="closingTime">
      <option value="4">In 4 hours (full price)</option>
      <option value="2" selected>In 2 hours (early discount)</option>
      <option value="0.75">In 45 minutes (final hour)</option>
      <option value="0.25">In 15 minutes (final hour)</option>
    </select>
    <div class="discount-preview" id="discountPreview"></div>
    <button class="btn-primary" id="publishBtn">Publish Listing</button>
  `;
}

function updateDiscountPreview(){
  const hours = parseFloat(document.getElementById('closingTime').value);
  const price = parseFloat(document.getElementById('foodPrice').value) || 0;
  const t = getTier(hours);
  const discounted = Math.round(price * (1 - t.pct/100));
  document.getElementById('discountPreview').innerHTML = `
    <div class="tier-label">System-calculated discount</div>
    <div class="tier-pct">${t.pct}% off → ${naira(discounted)}</div>
    <div class="tier-note">${t.label}</div>
  `;
}

function renderListingPreview(){
  const item = state.vendorItem;
  const t = getTier(item.hours);
  const discounted = Math.round(item.price * (1 - t.pct/100));
  return `
    <div class="back-btn" id="backDashboard">← Back to Dashboard</div>
    <h2 class="top-title">Your Listing is Live</h2>
    <div class="card" style="cursor:default">
      <div class="thumb">
<img src="images/images/Bokku bread.jpeg">
</div>
      <div class="card-info">
        <div class="vname">Your storefront</div>
        <div class="fname">${item.name}</div>
        <div class="price-row">
          <span class="price-old">${naira(item.price)}</span>
          <span class="price-new">${naira(discounted)}</span>
        </div>
        <div class="meta-row">
          <span class="time-ring" style="background:${t.ring}"></span>
          <span class="discount-tag">${t.pct}% OFF</span>
        </div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">3</div><div class="lab">Reservations</div></div>
      <div class="stat-box"><div class="num">${item.qty - 3 > 0 ? item.qty - 3 : 0}</div><div class="lab">Remaining</div></div>
      <div class="stat-box"><div class="num">${t.label.includes('4') ? '4h' : t.label.includes('Final') ? '<1h' : '2h'}</div><div class="lab">Time left</div></div>
    </div>
    <div class="action-row">
      <button class="btn-secondary" id="editListingBtn">Edit Listing</button>
      <button class="btn-primary orange" id="soldOutBtn">Mark as Sold Out</button>
    </div>
  `;
}

// ---------- interactions ----------
function attachHandlers(){
  document.querySelectorAll('.card[data-idx]').forEach(el=>{
    el.onclick = ()=>{ state.selectedItem = foodItems[parseInt(el.dataset.idx)]; state.buyerScreen='details'; render(); };
  });
  const backHome = document.getElementById('backHome');
  if(backHome) backHome.onclick = ()=>{ state.buyerScreen='home'; render(); };

  const reserveBtn = document.getElementById('reserveBtn');
  if(reserveBtn) reserveBtn.onclick = ()=>{ state.buyerScreen='checkout'; render(); };

  const backDetails = document.getElementById('backDetails');
  if(backDetails) backDetails.onclick = ()=>{ state.buyerScreen='details'; render(); };

  document.querySelectorAll('.pay-option').forEach(el=>{
    el.onclick = ()=>{ state.payMethod = el.dataset.pay; render(); };
  });

  const payBtn = document.getElementById('payBtn');
  if(payBtn) payBtn.onclick = ()=>{ state.buyerScreen='confirm'; render(); };

  const backConfirm = document.getElementById('backToHomeFromConfirm');
  if(backConfirm) backConfirm.onclick = ()=>{ state.buyerScreen='home'; state.selectedItem=null; render(); };

  // vendor
  const closingTime = document.getElementById('closingTime');
  const foodPrice = document.getElementById('foodPrice');
  if(closingTime){ closingTime.oninput = updateDiscountPreview; foodPrice.oninput = updateDiscountPreview; updateDiscountPreview(); }

  const uploadBox = document.getElementById('uploadBox');
  if(uploadBox) uploadBox.onclick = ()=>{ uploadBox.classList.add('filled'); uploadBox.innerHTML='🍞'; };

  const publishBtn = document.getElementById('publishBtn');
  if(publishBtn) publishBtn.onclick = ()=>{
    state.vendorItem = {
      name: document.getElementById('foodName').value || 'Untitled item',
      qty: parseFloat(document.getElementById('foodQty').value) || 0,
      price: parseFloat(document.getElementById('foodPrice').value) || 0,
      hours: parseFloat(document.getElementById('closingTime').value)
    };
    state.vendorScreen = 'listing';
    render();
  };

  const backDashboard = document.getElementById('backDashboard');
  if(backDashboard) backDashboard.onclick = ()=>{ state.vendorScreen='dashboard'; render(); };

  const editBtn = document.getElementById('editListingBtn');
  if(editBtn) editBtn.onclick = ()=>{ state.vendorScreen='dashboard'; render(); };

  const soldOutBtn = document.getElementById('soldOutBtn');
  if(soldOutBtn) soldOutBtn.onclick = ()=>{
    soldOutBtn.textContent = '✓ Marked Sold Out';
    soldOutBtn.style.background = 'var(--brown)';
    soldOutBtn.style.boxShadow = 'none';
  };
}

render();
</script>
</body>
</html>
